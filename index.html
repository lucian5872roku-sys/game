<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extreme AI Pong</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: radial-gradient(circle at center, #111, #000);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
  }

  canvas {
    border: 4px solid white;
    box-shadow: 0 0 30px white;
    background: black;
  }
</style>
</head>

<body>

<canvas id="game" width="900" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 15;

const player = {
  x: 25,
  y: 250,
  width: 15,
  height: 110,
  speed: 9,
  dy: 0
};

const ai = {
  x: canvas.width - 40,
  y: 250,
  width: 15,
  height: 110,
  speed: 7.5
};

const ball = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  size: 16,
  speed: 7,
  dx: 7,
  dy: 5
};

let playerScore = 0;
let aiScore = 0;

function resetBall(scoredOnPlayer) {
  ball.x = canvas.width / 2;
  ball.y = canvas.height / 2;

  ball.speed = 7;

  ball.dx = scoredOnPlayer ? -7 : 7;

  ball.dy = (Math.random() * 6 - 3);
}

function collision(ball, paddle) {
  return (
    ball.x < paddle.x + paddle.width &&
    ball.x + ball.size > paddle.x &&
    ball.y < paddle.y + paddle.height &&
    ball.y + ball.size > paddle.y
  );
}

function drawRect(x, y, w, h, color="white") {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function drawBall() {
  ctx.fillStyle = "white";

  ctx.beginPath();
  ctx.arc(
    ball.x + ball.size / 2,
    ball.y + ball.size / 2,
    ball.size / 2,
    0,
    Math.PI * 2
  );
  ctx.fill();
}

function drawCenterLine() {
  for (let i = 0; i < canvas.height; i += 30) {
    drawRect(canvas.width / 2 - 2, i, 4, 15, "#666");
  }
}

function drawScores() {
  ctx.fillStyle = "white";
  ctx.font = "48px Arial";

  ctx.fillText(playerScore, canvas.width / 4, 60);
  ctx.fillText(aiScore, canvas.width * 3 / 4, 60);

  ctx.font = "18px Arial";
  ctx.fillText("W/S to Move", 20, 30);
}

function update() {
  // PLAYER
  player.y += player.dy;

  if (player.y < 0) {
    player.y = 0;
  }

  if (player.y + player.height > canvas.height) {
    player.y = canvas.height - player.height;
  }

  // HARD AI
  let aiTarget = ball.y - ai.height / 2 + ball.size / 2;

  // AI predicts future ball movement
  if (ball.dx > 0) {
    ai.y += (aiTarget - ai.y) * 0.14;
  }

  // Clamp AI
  if (ai.y < 0) {
    ai.y = 0;
  }

  if (ai.y + ai.height > canvas.height) {
    ai.y = canvas.height - ai.height;
  }

  // BALL
  ball.x += ball.dx;
  ball.y += ball.dy;

  // TOP/BOTTOM COLLISION
  if (ball.y <= 0) {
    ball.y = 0;
    ball.dy *= -1;
  }

  if (ball.y + ball.size >= canvas.height) {
    ball.y = canvas.height - ball.size;
    ball.dy *= -1;
  }

  // PLAYER HIT
  if (collision(ball, player)) {
    ball.x = player.x + player.width;

    let collidePoint =
      (ball.y + ball.size / 2) -
      (player.y + player.height / 2);

    collidePoint /= (player.height / 2);

    let angle = collidePoint * Math.PI / 4;

    ball.speed += 0.35;

    ball.dx = ball.speed * Math.cos(angle);
    ball.dy = ball.speed * Math.sin(angle);
  }

  // AI HIT
  if (collision(ball, ai)) {
    ball.x = ai.x - ball.size;

    let collidePoint =
      (ball.y + ball.size / 2) -
      (ai.y + ai.height / 2);

    collidePoint /= (ai.height / 2);

    let angle = collidePoint * Math.PI / 4;

    ball.speed += 0.3;

    ball.dx = -ball.speed * Math.cos(angle);
    ball.dy = ball.speed * Math.sin(angle);
  }

  // SCORE
  if (ball.x < 0) {
    aiScore++;
    resetBall(false);
  }

  if (ball.x > canvas.width) {
    playerScore++;
    resetBall(true);
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawRect(0, 0, canvas.width, canvas.height, "black");

  drawCenterLine();

  drawRect(player.x, player.y, player.width, player.height);
  drawRect(ai.x, ai.y, ai.width, ai.height);

  drawBall();

  drawScores();
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// CONTROLS
document.addEventListener("keydown", e => {
  if (e.key === "w" || e.key === "W") {
    player.dy = -player.speed;
  }

  if (e.key === "s" || e.key === "S") {
    player.dy = player.speed;
  }
});

document.addEventListener("keyup", e => {
  if (
    e.key === "w" || e.key === "W" ||
    e.key === "s" || e.key === "S"
  ) {
    player.dy = 0;
  }
});

gameLoop();
</script>

</body>
</html>
